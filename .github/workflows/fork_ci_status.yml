# Mirror fork results as the informational CI (fork) check after upstream PR CI
# completes and through scheduled polling for late runs and reruns. Read fork
# runs and write upstream checks using the shared ASF fork-ci action.
# No checkout, artifacts, or code from the pull request are used here.
# See https://github.com/apache/infrastructure-actions/tree/main/fork-ci
name: Fork CI status

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  pull-requests: read

# One serialized group for notifications and sweeps, as fork-ci requires:
# concurrent callers can create duplicate checks or overwrite newer results.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bridge:
    if: github.repository == 'geographybuff-sandbox/arrow-rs-fork-ci-test' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    name: Mirror the fork run
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: geographybuff-sandbox/arrow-rs-fork-ci-test/actions/fork-ci-fixed@1330feb5fc4fe2b3e9dc3b2e49ea12915183956f  # fork-ci/v1.0.0 + apache/infrastructure-actions#1512 fix
        with:
          workflow: ci.yml
          check-name: CI (fork)
          base-branches: main
          guide-url: https://github.com/apache/arrow-rs/blob/main/CONTRIBUTING.md#pull-requests-from-forks
          sweep-minutes: '15'
