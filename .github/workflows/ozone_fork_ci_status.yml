# Copy of apache/ozone's fork-ci-status.yaml (2026-11-10): owner guard, mirrored workflow,
# base branch and the action reference changed; schedule removed (sweeps are dispatched).
name: Ozone-style fork CI status

on:
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Fork CI ping]
    types: [completed]

permissions:
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: ozone-fork-ci-status
  cancel-in-progress: false
  queue: max # do not cancel pending jobs

jobs:
  bridge:
    if: github.repository_owner == 'geographybuff-sandbox'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: geographybuff-sandbox/arrow-rs-fork-ci-test/actions/fork-ci-fixed@1330feb5fc4fe2b3e9dc3b2e49ea12915183956f
        with:
          workflow: ci.yml
          base-branches: |
            main
          check-name: build-branch (fork)
          recent-hours: 6
          sweep-minutes: '15'
